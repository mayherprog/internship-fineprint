name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Tests, validation, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Dataset validation
        run: python3 tools/validate.py
      - name: Site builds
        run: python3 tools/build.py

  frontend:
    name: TypeScript front end builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Export data for the app
        run: python3 tools/export_json.py web/public/data.json
      - name: Type-check and build
        run: npm run build
        working-directory: web
