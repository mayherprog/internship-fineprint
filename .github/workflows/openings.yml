name: Openings

# Phase 2 (PHASE2.md): the fast loop. Daily at 13:00 UTC — US careers pages
# update on business mornings — run every active opening detector, then:
#   - OPENED / CHANGED rows open or update the issue labeled 'opening'
#     (GitHub notifications on that label are the push channel);
#   - openings_state.json is committed so history shows exactly when each
#     watched page moved.
# BLOCKED proves nothing and never alerts; MANUAL rows are standing reminders.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  openings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run opening detectors
        run: python3 tools/check_openings.py | tee openings.txt
      - name: Open or update the opening issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('openings.txt', 'utf8');
            const opened = /^OPENED/m.test(body);
            const changed = /^CHANGED/m.test(body);
            if (!opened && !changed) { core.info('nothing opened or changed; no issue'); return; }
            const stamp = new Date().toISOString().slice(0, 10);
            const title = 'Opening monitor: watched pages moved';
            const text = 'Automated daily check (' + stamp + '). OPENED rows are state ' +
              'transitions on a watched page or board — read the quoted evidence and ' +
              'update the data row; CHANGED rows moved without a watched phrase ' +
              'flipping and need a human read. The monitor records what firms state, ' +
              'never verdicts.\n\n```\n' + body.slice(0, 60000) + '\n```';
            const {data: open} = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'opening'});
            if (open.length) {
              await github.rest.issues.createComment({...context.repo,
                issue_number: open[0].number, body: text});
            } else {
              await github.rest.issues.create({...context.repo,
                title, body: text, labels: ['opening']});
            }
      - name: Commit detector state
        run: |
          if [ -z "$(git status --porcelain tools/openings_state.json)" ]; then
            echo "state unchanged"; exit 0
          fi
          git config user.name "openings-monitor"
          git config user.email "actions@github.com"
          git add tools/openings_state.json
          git commit -m "Openings state: $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push origin main
